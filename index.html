<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GERTY</title>

<style>
body {
  background:#08090c;
  color:#cdd6e8;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

button {
  padding:20px;
  font-size:18px;
  border-radius:50%;
  border:2px solid #4fc3f7;
  background:transparent;
  color:white;
}

#status { margin-top:20px; }
</style>
</head>

<body>

<h1>GERTY</h1>
<button onclick="start()">🎤</button>
<div id="status">Idle</div>

<audio id="audio" autoplay playsinline></audio>

<script>
const WORKER_URL = "https://gerty-session.clevelandbuilders.workers.dev";

let pc, dc, stream;

async function start() {

  log("Starting");

  document.getElementById("status").innerText = "Connecting...";

  // MIC
  stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  log("Mic ready");

  // TOKEN
  const res = await fetch(WORKER_URL + "/session", { method:"POST" });
  const data = await res.json();
  const token = data.value;

  if (!token) {
    document.getElementById("status").innerText = "Worker error";
    log(JSON.stringify(data));
    return;
  }

  log("Token OK");

  // PEER
  pc = new RTCPeerConnection();

  pc.ontrack = e => {
    document.getElementById("audio").srcObject = e.streams[0];
    log("Audio received");
  };

  dc = pc.createDataChannel("oai-events");

  dc.onopen = () => {
    log("Data channel open");
    document.getElementById("status").innerText = "Listening";

    // 🔥 REQUIRED: Configure session
    dc.send(JSON.stringify({
      type:"session.update",
      session:{
        type:"realtime",
        model:"gpt-realtime",
        output_modalities:["audio"]
      }
    }));

    // 🔥 REQUIRED: Actually trigger response
    setTimeout(() => {
      dc.send(JSON.stringify({
        type:"response.create",
        response: {
          instructions: "Say: Hello Dan, I'm online."
        }
      }));
      log("Response triggered");
    }, 800);
  };

  dc.onmessage = e => {
    const msg = JSON.parse(e.data);

    if (msg.type === "response.audio_transcript.done") {
      log("GERTY: " + msg.transcript);
    }
  };

  stream.getTracks().forEach(t => pc.addTrack(t, stream));

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const form = new FormData();
  form.append("sdp", new Blob([offer.sdp], { type:"application/sdp" }));

  log("Sending SDP");

  const call = await fetch("https://api.openai.com/v1/realtime/calls", {
    method:"POST",
    headers:{ Authorization:"Bearer " + token },
    body:form
  });

  const answer = await call.text();

  await pc.setRemoteDescription({
    type:"answer",
    sdp:answer
  });

  log("Connected");
}

function log(msg){
  console.log(msg);
  document.body.innerHTML += "<div style='font-size:10px'>" + msg + "</div>";
}
</script>

</body>
</html>
