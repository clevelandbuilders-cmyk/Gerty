<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GERTY</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background:#08090c;
  color:#cfd8dc;
  font-family:'Rajdhani', sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container {
  text-align:center;
}

h1 {
  font-family:'Share Tech Mono';
  letter-spacing:3px;
  color:#e0e0e0;
}

.mic {
  width:120px;
  height:120px;
  border-radius:50%;
  border:2px solid #4fc3f7;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:20px auto;
  font-size:40px;
  color:#4fc3f7;
  cursor:pointer;
  transition:0.2s;
}

.mic.active {
  box-shadow:0 0 25px #00e5ff;
}

.status {
  margin-top:10px;
  font-size:18px;
  color:#90caf9;
}

.transcript {
  margin-top:20px;
  max-width:300px;
  font-size:16px;
  opacity:0.85;
}
</style>
</head>

<body>

<div class="container">
  <h1>GERTY</h1>
  <div id="mic" class="mic">🎤</div>
  <div id="status" class="status">IDLE</div>
  <div id="transcript" class="transcript"></div>
</div>

<script>
let pc, dc, audioEl;
let isStarting = false;
let isConnected = false;

const micBtn = document.getElementById("mic");
const statusEl = document.getElementById("status");
const transcriptEl = document.getElementById("transcript");

function setStatus(s){
  statusEl.innerText = s;
}

micBtn.onclick = async () => {

  if (isStarting) return;

  if (isConnected) {
    stopGerty();
    return;
  }

  startGerty();
};

async function startGerty(){
  isStarting = true;
  setStatus("CONNECTING...");
  micBtn.classList.add("active");

  try {

    // get ephemeral token
    const tokenRes = await fetch("https://gerty-session.clevelandbuilders.workers.dev");
    const data = await tokenRes.json();
    const EPHEMERAL_KEY = data.client_secret.value;

    pc = new RTCPeerConnection();

    audioEl = document.createElement("audio");
    audioEl.autoplay = true;

    pc.ontrack = e => {
      audioEl.srcObject = e.streams[0];
    };

    dc = pc.createDataChannel("oai-events");

    dc.onopen = () => {
      console.log("Data channel open");
    };

    dc.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);

        if (msg.type === "response.audio_transcript.delta") {
          transcriptEl.innerText += msg.delta;
        }

        if (msg.type === "response.completed") {
          setStatus("LISTENING");
        }

      } catch(e){}
    };

    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(track => pc.addTrack(track, stream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const baseUrl = "https://api.openai.com/v1/realtime/calls";

    const sdpResponse = await fetch(baseUrl, {
      method:"POST",
      body:offer.sdp,
      headers:{
        Authorization:`Bearer ${EPHEMERAL_KEY}`,
        "Content-Type":"application/sdp"
      }
    });

    const answer = {
      type:"answer",
      sdp:await sdpResponse.text()
    };

    await pc.setRemoteDescription(answer);

    isConnected = true;
    setStatus("LISTENING");

  } catch(err){
    console.error(err);
    setStatus("ERROR");
    micBtn.classList.remove("active");
  }

  isStarting = false;
}

function stopGerty(){
  if (pc) pc.close();
  if (dc) dc.close();

  isConnected = false;
  setStatus("IDLE");
  micBtn.classList.remove("active");
  transcriptEl.innerText = "";
}
</script>

</body>
</html>
