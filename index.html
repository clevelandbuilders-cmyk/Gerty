<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERTY</title>

<style>
body {
  background:#08090c;
  color:white;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}
button {
  width:90px;
  height:90px;
  font-size:30px;
  border-radius:50%;
  border:2px solid #4fc3f7;
  background:transparent;
  color:white;
}
#status { margin-top:20px; }
#log {
  margin-top:20px;
  max-height:200px;
  overflow:auto;
  font-size:12px;
  opacity:.8;
}
</style>
</head>

<body>

<h1>GERTY</h1>
<button onclick="start()">🎤</button>
<div id="status">Idle</div>
<div id="log"></div>

<audio id="audio" autoplay playsinline></audio>

<script>
const WORKER_URL = "https://gerty-session.clevelandbuilders.workers.dev";

let pc, dc, stream;

function log(t){
  document.getElementById("log").innerHTML += t + "<br>";
}

function status(t){
  document.getElementById("status").innerText = t;
}

async function start(){

  try {

    status("Connecting...");
    log("Starting");

    stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    log("Mic ready");

    // GET TOKEN
    const res = await fetch(WORKER_URL + "/session",{ method:"POST" });
    const data = await res.json();

    const token = data.value;

    if(!token){
      status("Worker error");
      log(JSON.stringify(data));
      return;
    }

    log("Token OK");

    pc = new RTCPeerConnection({
      iceServers:[
        { urls:"stun:stun.l.google.com:19302" }
      ]
    });

    pc.ontrack = e=>{
      document.getElementById("audio").srcObject = e.streams[0];
      log("Audio received");
    };

    dc = pc.createDataChannel("oai-events");

    dc.onopen = ()=>{
      log("Data channel open");
      status("Listening");

      dc.send(JSON.stringify({
        type:"session.update",
        session:{
          type:"realtime",
          model:"gpt-realtime",
          output_modalities:["audio","text"]
        }
      }));

      setTimeout(()=>{
        dc.send(JSON.stringify({ type:"response.create" }));
      },500);
    };

    stream.getTracks().forEach(t=>pc.addTrack(t,stream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    log("Sending SDP");

    // ✅ FIXED FORM DATA
    const form = new FormData();
    form.append(
      "sdp",
      new Blob([offer.sdp], { type:"application/sdp" }),
      "offer.sdp" // 🔥 THIS FIXES YOUR ISSUE
    );

    const call = await fetch("https://api.openai.com/v1/realtime/calls",{
      method:"POST",
      headers:{
        Authorization:"Bearer "+token
      },
      body:form
    });

    const answer = await call.text();

    if(!call.ok){
      throw new Error(answer);
    }

    await pc.setRemoteDescription({
      type:"answer",
      sdp:answer
    });

    log("Connected");
    status("Connected");

  } catch(e){
    log("ERROR: "+e.message);
    status("Error");
    console.error(e);
  }
}
</script>

</body>
</html>
