<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERTY</title>
<style>
body {
  background:#08090c;
  color:#cdd6e8;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
}

button {
  width:90px;
  height:90px;
  font-size:32px;
  border-radius:50%;
  border:2px solid #4fc3f7;
  background:transparent;
  color:white;
}

#status {
  margin-top:20px;
}

#log {
  margin-top:20px;
  max-width:90vw;
  font-size:12px;
  opacity:.8;
}
</style>
</head>

<body>

<h1>GERTY</h1>
<button id="micBtn">🎤</button>
<div id="status">Idle</div>
<div id="log"></div>

<audio id="audio" autoplay playsinline></audio>

<script>
const WORKER_URL = "https://gerty-session.clevelandbuilders.workers.dev";

let pc = null;
let dc = null;
let stream = null;

const micBtn = document.getElementById("micBtn");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const audioEl = document.getElementById("audio");

function status(text) {
  statusEl.innerText = text;
  console.log(text);
}

function log(text) {
  logEl.innerHTML += text + "<br>";
  console.log(text);
}

micBtn.addEventListener("click", start);

async function start() {
  try {
    status("Connecting...");

    audioEl.muted = false;
    audioEl.volume = 1.0;
    await audioEl.play().catch(() => {});

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    log("Mic ready");

    const res = await fetch(WORKER_URL + "/session", {
      method: "POST"
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error("Worker returned " + res.status + ": " + JSON.stringify(data));
    }

    const token = data.value;

    if (!token) {
      throw new Error("No token returned from Worker: " + JSON.stringify(data));
    }

    log("Token received");

    pc = new RTCPeerConnection({
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    });

    pc.oniceconnectionstatechange = () => {
      log("ICE: " + pc.iceConnectionState);
    };

    pc.onconnectionstatechange = () => {
      log("PC: " + pc.connectionState);
    };

    pc.ontrack = (event) => {
      log("Remote audio track received");
      audioEl.srcObject = event.streams[0];
      audioEl.muted = false;
      audioEl.volume = 1.0;
      setTimeout(() => {
        audioEl.play()
          .then(() => log("Audio playing"))
          .catch(err => log("Audio play failed: " + err.message));
      }, 200);
    };

    dc = pc.createDataChannel("oai-events");

    dc.onopen = () => {
      log("Data channel open");
      status("Listening");

      dc.send(JSON.stringify({
        type: "session.update",
        session: {
          type: "realtime",
          model: "gpt-realtime",
          output_modalities: ["audio", "text"],
          audio: {
            input: {
              turn_detection: {
                type: "server_vad",
                threshold: 0.5,
                prefix_padding_ms: 300,
                silence_duration_ms: 700
              }
            },
            output: {
              voice: "alloy"
            }
          },
          input_audio_transcription: {
            model: "gpt-4o-mini-transcribe"
          }
        }
      }));

      setTimeout(() => {
        if (dc && dc.readyState === "open") {
          dc.send(JSON.stringify({ type: "response.create" }));
          log("Initial response requested");
        }
      }, 500);
    };

    dc.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      console.log("Server event:", msg);

      if (msg.type === "conversation.item.input_audio_transcription.completed") {
        log("YOU: " + msg.transcript);
      }

      if (msg.type === "response.audio_transcript.done") {
        log("GERTY: " + msg.transcript);
      }

      if (msg.type === "response.created") {
        status("GERTY speaking");
      }

      if (msg.type === "response.done") {
        status("Listening");
      }

      if (msg.type === "error") {
        log("ERROR: " + JSON.stringify(msg.error));
      }
    };

    stream.getAudioTracks().forEach(track => {
      pc.addTrack(track, stream);
      log("Mic track added");
    });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const form = new FormData();
    form.append("sdp", new Blob([offer.sdp], { type: "application/sdp" }), "offer.sdp");

    const call = await fetch("https://api.openai.com/v1/realtime/calls", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token
      },
      body: form
    });

    const answer = await call.text();

    if (!call.ok) {
      throw new Error("OpenAI call failed " + call.status + ": " + answer);
    }

    await pc.setRemoteDescription({
      type: "answer",
      sdp: answer
    });

    log("WebRTC connected");

  } catch (err) {
    console.error(err);
    status("Error");
    log("ERROR: " + err.message);
  }
}
</script>

</body>
</html>
