<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERTY</title>
<style>
body {
  background:#08090c;
  color:white;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
}

button {
  width:110px;
  height:110px;
  font-size:36px;
  border-radius:50%;
  border:2px solid #4fc3f7;
  background:transparent;
  color:white;
}

#status { margin-top:20px; }

#log {
  margin-top:20px;
  max-height:300px;
  max-width:92vw;
  overflow:auto;
  font-size:12px;
  line-height:1.5;
}

#version {
  position:fixed;
  bottom:10px;
  opacity:.5;
  font-size:11px;
}
</style>
</head>

<body>

<h1>GERTY</h1>
<button id="micBtn">🎤</button>
<div id="status">Idle</div>
<div id="log"></div>
<div id="version">ANDROID DEBUG v4</div>

<audio id="audio" autoplay playsinline></audio>

<script>
const WORKER_URL = "https://gerty-session.clevelandbuilders.workers.dev";

let pc = null;
let dc = null;
let stream = null;
let busy = false;

const micBtn = document.getElementById("micBtn");
const audioEl = document.getElementById("audio");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function status(text) {
  statusEl.innerText = text;
  console.log(text);
}

function log(text) {
  logEl.innerHTML += text + "<br>";
  logEl.scrollTop = logEl.scrollHeight;
  console.log(text);
}

function cleanup() {
  busy = false;

  if (dc) {
    try { dc.close(); } catch(e) {}
    dc = null;
  }

  if (pc) {
    try { pc.close(); } catch(e) {}
    pc = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  audioEl.srcObject = null;
}

function timeoutPromise(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => {
      setTimeout(() => reject(new Error(label + " timed out")), ms);
    })
  ]);
}

function waitForIceGatheringComplete(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === "complete") {
      resolve();
      return;
    }

    function checkState() {
      log("ICE gathering: " + pc.iceGatheringState);
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", checkState);
        resolve();
      }
    }

    pc.addEventListener("icegatheringstatechange", checkState);

    setTimeout(() => {
      pc.removeEventListener("icegatheringstatechange", checkState);
      log("ICE gather timeout, continuing");
      resolve();
    }, 3000);
  });
}

micBtn.addEventListener("click", async function() {
  log("BUTTON CLICKED");

  if (busy) {
    log("Already starting");
    return;
  }

  if (pc) {
    cleanup();
    status("Idle");
    log("Stopped");
    return;
  }

  await start();
});

async function start() {
  try {
    cleanup();
    busy = true;

    status("Starting...");
    log("Starting GERTY");
    log("User agent: " + navigator.userAgent);

    audioEl.muted = false;
    audioEl.volume = 1.0;
    await audioEl.play().catch(() => {});
    log("Audio unlocked");

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("getUserMedia is not available in this browser");
    }

    log("Requesting microphone permission...");

    stream = await timeoutPromise(
      navigator.mediaDevices.getUserMedia({
        audio: true,
        video: false
      }),
      12000,
      "Microphone request"
    );

    log("Mic ready");

    const tracks = stream.getAudioTracks();
    log("Audio tracks: " + tracks.length);

    if (!tracks.length) {
      throw new Error("No audio track returned");
    }

    pc = new RTCPeerConnection({
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    });

    pc.oniceconnectionstatechange = () => {
      log("ICE connection: " + pc.iceConnectionState);
    };

    pc.onconnectionstatechange = () => {
      log("PC state: " + pc.connectionState);

      if (pc.connectionState === "connected") {
        status("Listening");
      }

      if (pc.connectionState === "failed") {
        status("Connection failed");
      }
    };

    pc.ontrack = function(event) {
      log("Audio received");
      audioEl.srcObject = event.streams[0];
      audioEl.muted = false;
      audioEl.volume = 1.0;

      setTimeout(() => {
        audioEl.play()
          .then(() => log("Audio playing"))
          .catch(err => log("Audio play failed: " + err.message));
      }, 200);
    };

    dc = pc.createDataChannel("oai-events");

    dc.onopen = function() {
      log("Data channel open");
      status("Listening");

      setTimeout(() => {
        if (dc && dc.readyState === "open") {
          dc.send(JSON.stringify({
            type: "response.create",
            response: {
              instructions: "Say exactly: Hello Dan, I am online and ready to help."
            }
          }));
          log("Initial response requested");
        }
      }, 800);
    };

    dc.onmessage = function(event) {
      let msg;

      try {
        msg = JSON.parse(event.data);
      } catch(e) {
        log("Received non-JSON message");
        return;
      }

      if (msg.type === "response.created") {
        status("GERTY speaking");
      }

      if (msg.type === "response.done") {
        status("Listening");
      }

      if (msg.type === "error") {
        log("SERVER ERROR: " + JSON.stringify(msg.error));
      }

      if (msg.type === "response.audio_transcript.done" && msg.transcript) {
        log("GERTY: " + msg.transcript);
      }
    };

    tracks.forEach(track => {
      pc.addTrack(track, stream);
      log("Mic track added: " + track.kind + " " + track.readyState);
    });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    log("Offer created");
    await waitForIceGatheringComplete(pc);

    const sdpToSend = pc.localDescription.sdp;
    log("Sending SDP length: " + sdpToSend.length);

    const sdpRes = await fetch(WORKER_URL + "/session", {
      method: "POST",
      headers: {
        "Content-Type": "application/sdp"
      },
      body: sdpToSend
    });

    const answerText = await sdpRes.text();

    log("Worker SDP status: " + sdpRes.status);

    if (!sdpRes.ok) {
      throw new Error(answerText);
    }

    await pc.setRemoteDescription({
      type: "answer",
      sdp: answerText
    });

    log("Remote SDP set");
    busy = false;

  } catch (err) {
    console.error(err);
    status("Error");
    log("ERROR: " + err.message);
    cleanup();
  }
}
</script>

</body>
</html>
