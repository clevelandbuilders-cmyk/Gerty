<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERTY</title>

<style>
body {
  background:#08090c;
  color:white;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
}

button {
  width:110px;
  height:110px;
  font-size:36px;
  border-radius:50%;
  border:2px solid #4fc3f7;
  background:transparent;
  color:white;
}

#status { margin-top:20px; }

#log {
  margin-top:20px;
  max-height:300px;
  max-width:92vw;
  overflow:auto;
  font-size:12px;
}

#version {
  position:fixed;
  bottom:10px;
  font-size:11px;
  opacity:.5;
}
</style>
</head>

<body>

<h1>GERTY</h1>
<button id="micBtn">🎤</button>
<div id="status">Idle</div>
<div id="log"></div>
<div id="version">ANDROID FIX v5</div>

<audio id="audio" autoplay playsinline></audio>

<script>
const WORKER_URL = "https://gerty-session.clevelandbuilders.workers.dev";

let pc = null;
let dc = null;
let stream = null;
let busy = false;

const micBtn = document.getElementById("micBtn");
const audioEl = document.getElementById("audio");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function status(text){
  statusEl.innerText = text;
}

function log(text){
  logEl.innerHTML += text + "<br>";
  logEl.scrollTop = logEl.scrollHeight;
  console.log(text);
}

function cleanup(){
  busy = false;

  if (dc) { try { dc.close(); } catch(e) {} dc = null; }
  if (pc) { try { pc.close(); } catch(e) {} pc = null; }

  if (stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  audioEl.srcObject = null;
}

function waitForIce(pc){
  return new Promise(resolve=>{
    if(pc.iceGatheringState === "complete") return resolve();

    pc.onicegatheringstatechange = ()=>{
      if(pc.iceGatheringState === "complete") resolve();
    };

    setTimeout(resolve,3000);
  });
}

micBtn.onclick = async ()=>{
  if(busy) return;

  if(pc){
    cleanup();
    status("Idle");
    log("Stopped");
    return;
  }

  await start();
};

async function start(){
  try{
    cleanup();
    busy = true;

    status("Starting...");
    log("Starting GERTY");

    // 🚫 REMOVED audioEl.play() — this was freezing Android

    log("Requesting mic...");

    stream = await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:false
    });

    log("Mic ready");

    pc = new RTCPeerConnection({
      iceServers:[
        {urls:"stun:stun.l.google.com:19302"}
      ]
    });

    pc.ontrack = e=>{
      log("Audio received");
      audioEl.srcObject = e.streams[0];

      // play AFTER real audio arrives (Android safe)
      audioEl.play().catch(()=>{});
    };

    dc = pc.createDataChannel("oai-events");

    dc.onopen = ()=>{
      log("Data channel open");
      status("Listening");

      setTimeout(()=>{
        dc.send(JSON.stringify({
          type:"response.create",
          response:{
            instructions:"Say: GERTY is online."
          }
        }));
      },500);
    };

    dc.onmessage = e=>{
      const msg = JSON.parse(e.data);

      if(msg.type === "response.created"){
        status("Speaking");
      }

      if(msg.type === "response.done"){
        status("Listening");
      }

      if(msg.type === "error"){
        log("SERVER ERROR: "+JSON.stringify(msg.error));
      }
    };

    stream.getTracks().forEach(t=>{
      pc.addTrack(t,stream);
      log("Mic track added");
    });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await waitForIce(pc);

    const res = await fetch(WORKER_URL+"/session",{
      method:"POST",
      headers:{ "Content-Type":"application/sdp" },
      body:pc.localDescription.sdp
    });

    const answer = await res.text();

    if(!res.ok) throw new Error(answer);

    await pc.setRemoteDescription({
      type:"answer",
      sdp:answer
    });

    log("Connected");
    busy = false;

  }catch(err){
    status("Error");
    log("ERROR: "+err.message);
    cleanup();
  }
}
</script>

</body>
</html>
