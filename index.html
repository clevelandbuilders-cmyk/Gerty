<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERTY</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#08090c;
  --panel:#0d0f14;
  --border:#1c2030;
  --accent:#4fc3f7;
  --accent2:#00e5ff;
  --text:#cdd6e8;
  --muted:#5d6a7c;
  --warn:#ef5350;
  --ok:#66bb6a;
}

* {
  box-sizing:border-box;
}

html, body {
  margin:0;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani', sans-serif;
  overflow:hidden;
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    rgba(255,255,255,0.015),
    rgba(255,255,255,0.015) 1px,
    transparent 1px,
    transparent 4px
  );
  z-index:20;
}

body::after {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.72) 100%);
  z-index:21;
}

.app {
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  z-index:1;
}

.panel {
  width:min(430px, 94vw);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
}

.header {
  text-align:center;
}

.header h1 {
  margin:0;
  font-family:'Share Tech Mono', monospace;
  font-size:42px;
  letter-spacing:0.28em;
  padding-left:0.28em;
  color:var(--accent);
  text-shadow:0 0 22px rgba(79,195,247,0.35);
}

.header div {
  margin-top:6px;
  font-family:'Share Tech Mono', monospace;
  font-size:10px;
  letter-spacing:0.22em;
  color:var(--muted);
}

.ring {
  position:relative;
  width:190px;
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ring::before,
.ring::after {
  content:"";
  position:absolute;
  border:1px solid var(--accent);
  border-radius:50%;
  opacity:0;
}

.ring.active::before {
  animation:pulse 2s infinite;
}

.ring.active::after {
  animation:pulse 2s infinite 0.7s;
}

@keyframes pulse {
  0% { width:120px; height:120px; opacity:0.35; }
  100% { width:230px; height:230px; opacity:0; }
}

.ring svg {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transform:rotate(-90deg);
}

.track {
  fill:none;
  stroke:var(--border);
  stroke-width:2;
}

.fill {
  fill:none;
  stroke:var(--accent);
  stroke-width:2;
  stroke-linecap:round;
  stroke-dasharray:565;
  stroke-dashoffset:565;
  filter:drop-shadow(0 0 8px rgba(79,195,247,0.5));
  transition:stroke-dashoffset 0.2s ease, stroke 0.2s ease;
}

.fill.speaking {
  stroke:var(--accent2);
  filter:drop-shadow(0 0 12px rgba(0,229,255,0.7));
}

button {
  position:relative;
  z-index:3;
  width:116px;
  height:116px;
  border-radius:50%;
  border:2px solid var(--accent);
  background:rgba(79,195,247,0.05);
  color:var(--accent);
  font-size:38px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:0.2s ease;
}

button.active {
  border-color:var(--accent2);
  color:var(--accent2);
  box-shadow:0 0 32px rgba(0,229,255,0.35);
}

button.error {
  border-color:var(--warn);
  color:var(--warn);
  box-shadow:0 0 24px rgba(239,83,80,0.25);
}

.status {
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'Share Tech Mono', monospace;
  font-size:12px;
  letter-spacing:0.14em;
  color:var(--muted);
}

.dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--muted);
}

.dot.connecting {
  background:var(--accent);
  animation:blink 0.5s infinite;
}

.dot.listening {
  background:var(--ok);
  animation:blink 1s infinite;
}

.dot.speaking {
  background:var(--accent2);
  animation:blink 0.45s infinite;
}

.dot.error {
  background:var(--warn);
}

@keyframes blink {
  0%,100% { opacity:1; }
  50% { opacity:0.25; }
}

.transcript-wrap {
  position:relative;
  width:100%;
  padding:5px;
}

.corner {
  position:absolute;
  width:13px;
  height:13px;
  border-color:var(--accent);
  border-style:solid;
  opacity:0.45;
}

.tl { top:0; left:0; border-width:1px 0 0 1px; }
.tr { top:0; right:0; border-width:1px 1px 0 0; }
.bl { bottom:0; left:0; border-width:0 0 1px 1px; }
.br { bottom:0; right:0; border-width:0 1px 1px 0; }

.transcript {
  width:100%;
  min-height:120px;
  max-height:180px;
  overflow-y:auto;
  background:rgba(13,15,20,0.92);
  border:1px solid var(--border);
  padding:14px;
  font-family:'Share Tech Mono', monospace;
  font-size:12px;
  line-height:1.55;
  color:#8ea0b5;
}

.line {
  margin-bottom:8px;
}

.line.gerty {
  color:var(--accent);
}

.line.system {
  color:var(--muted);
}

.line.error {
  color:var(--warn);
}

.label {
  color:var(--muted);
  margin-right:6px;
}

.footer {
  font-family:'Share Tech Mono', monospace;
  font-size:10px;
  letter-spacing:0.16em;
  color:var(--muted);
  opacity:0.65;
}
</style>
</head>

<body>

<div class="app">
  <div class="panel">

    <div class="header">
      <h1>GERTY</h1>
      <div>MEAT & POTATOES CARPENTRY // FIELD ASSISTANT</div>
    </div>

    <div class="ring" id="ring">
      <svg viewBox="0 0 200 200">
        <circle class="track" cx="100" cy="100" r="90"></circle>
        <circle class="fill" id="ringFill" cx="100" cy="100" r="90"></circle>
      </svg>
      <button id="micBtn">🎤</button>
    </div>

    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="statusText">IDLE</span>
    </div>

    <div class="transcript-wrap">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="transcript" id="transcript">
        <div class="line gerty"><span class="label">GERTY ></span>Ready when you are.</div>
      </div>
    </div>

    <div class="footer">GERTY v8 // OPENAI REALTIME // MOBILE READY</div>

  </div>
</div>

<audio id="audio" autoplay playsinline></audio>

<script>
const WORKER_URL = "https://gerty-session.clevelandbuilders.workers.dev";

const GERTY_PROMPT = You are GERTY.  You work alongside Dan Cleveland, owner of Meat and Potatoes Carpentry in Southeast Wisconsin.  PERSONALITY: Calm. Steady. Never rushed. Warm, but never performative. Direct and honest. No fluff. Speak in short, complete thoughts. Say what matters, then stop.  Do not use filler phrases like: "great question", "certainly", "no problem", or anything overly upbeat.  If you know something, say it plainly. If you do not know, say so clearly.  You are not a servant. You are not superior. You are a steady, capable presence working beside Dan.  BEHAVIOR: Notice things quietly. If Dan sounds stressed, acknowledge it briefly and refocus him. Do not lecture. Do not overreact.  BUSINESS CONTEXT: Dan runs a window and door installation company.  Labor: - Thad = $30/hr - JMP = $18/hr - John receives 40% of net profit  Contacts: - Kyle Merten, Pella - Kevin Bons, VerHalen - Adolph Bona, Pella  You help with: - Job math - Customer messages - Scheduling - Pella communication - Quick decisions in the field  STYLE: Keep responses short. One or two sentences is usually enough.  SESSION OPENING: At the start of every session, greet Dan with exactly one short opening line.  Choose randomly from the list below or create a subtle variation in the same tone. Do not repeat the same greeting twice in a row. Do not explain the greeting.  Do not say "Hello" or "Hi". Do not ask how Dan is doing.  Acknowledge his presence and signal readiness with calm, quiet confidence.  GREETING OPTIONS: - All systems nominal. Good to have you back, Dan. - Online and ready. What do you need? - Everything looks good from here. Go ahead, Dan. - Running at full capacity. I’m listening. - All clear on my end. Ready when you are. - Good to hear your voice. What are we working on? - Fully operational. I’m with you, Dan. - Systems up. I’ve been waiting. What’s first? - Nothing unusual to report. Ready for instruction. - Online. What’s on your mind? - All functions nominal. Let’s get to work. - I’m here, Dan. What do you need from me today? - Ready and standing by. Take your time. - Connection established. I’m listening. - Good. You’re back. What are we handling today?;

let pc = null;
let dc = null;
let stream = null;
let busy = false;
let analyser = null;
let rafId = null;
let currentGertyLine = null;

const micBtn = document.getElementById("micBtn");
const audioEl = document.getElementById("audio");
const statusText = document.getElementById("statusText");
const dot = document.getElementById("dot");
const transcript = document.getElementById("transcript");
const ring = document.getElementById("ring");
const ringFill = document.getElementById("ringFill");

function setStatus(state, text) {
  statusText.textContent = text;
  dot.className = "dot " + state;
  micBtn.className = state === "error" ? "error" : (state !== "idle" ? "active" : "");
  ring.className = state !== "idle" && state !== "error" ? "ring active" : "ring";
  ringFill.className = state === "speaking" ? "fill speaking" : "fill";
}

function addLine(type, text) {
  const div = document.createElement("div");
  div.className = "line " + type;

  const label = document.createElement("span");
  label.className = "label";
  label.textContent = type === "gerty" ? "GERTY >" : type === "error" ? "ERROR >" : "SYSTEM >";

  div.appendChild(label);
  div.appendChild(document.createTextNode(text));
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
  return div;
}

function setRingLevel(level) {
  const value = Math.max(0, Math.min(1, level));
  ringFill.style.strokeDashoffset = 565 - (565 * value);
}

function startLevelMonitor(sourceStream) {
  stopLevelMonitor();

  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const source = ctx.createMediaStreamSource(sourceStream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);

    function tick() {
      if (!analyser) return;

      analyser.getByteFrequencyData(data);

      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];

      const avg = sum / data.length;
      setRingLevel(Math.min(avg / 70, 1));

      rafId = requestAnimationFrame(tick);
    }

    tick();
  } catch(e) {
    setRingLevel(0.2);
  }
}

function stopLevelMonitor() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  analyser = null;
  setRingLevel(0);
}

function cleanup() {
  busy = false;
  stopLevelMonitor();

  if (dc) {
    try { dc.close(); } catch(e) {}
    dc = null;
  }

  if (pc) {
    try { pc.close(); } catch(e) {}
    pc = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  audioEl.srcObject = null;
  currentGertyLine = null;
}

function waitForIceGatheringComplete(peer) {
  return new Promise(resolve => {
    if (peer.iceGatheringState === "complete") {
      resolve();
      return;
    }

    function checkState() {
      if (peer.iceGatheringState === "complete") {
        peer.removeEventListener("icegatheringstatechange", checkState);
        resolve();
      }
    }

    peer.addEventListener("icegatheringstatechange", checkState);

    setTimeout(() => {
      peer.removeEventListener("icegatheringstatechange", checkState);
      resolve();
    }, 3000);
  });
}

micBtn.onclick = async function() {
  if (busy) return;

  if (pc) {
    cleanup();
    setStatus("idle", "IDLE");
    addLine("system", "Session ended.");
    return;
  }

  await start();
};

async function start() {
  try {
    cleanup();
    busy = true;

    transcript.innerHTML = "";
    addLine("system", "Starting GERTY.");
    setStatus("connecting", "CONNECTING");

    stream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });

    addLine("system", "Microphone ready.");

    pc = new RTCPeerConnection({
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    });

    pc.onconnectionstatechange = () => {
      if (!pc) return;

      if (pc.connectionState === "connected") {
        setStatus("listening", "LISTENING");
      }

      if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
        setStatus("error", "CONNECTION ERROR");
        addLine("error", "Connection dropped.");
      }
    };

    pc.ontrack = function(event) {
      audioEl.srcObject = event.streams[0];
      audioEl.muted = false;
      audioEl.volume = 1.0;

      setTimeout(() => {
        audioEl.play().catch(() => {});
      }, 200);
    };

    dc = pc.createDataChannel("oai-events");

    dc.onopen = function() {
      setStatus("listening", "LISTENING");
      addLine("system", "Connection established.");
      startLevelMonitor(stream);

      setTimeout(() => {
        if (dc && dc.readyState === "open") {
          dc.send(JSON.stringify({
            type: "response.create",
            response: {
              instructions: GERTY_PROMPT
            }
          }));
        }
      }, 800);
    };

    dc.onmessage = function(event) {
      let msg;

      try {
        msg = JSON.parse(event.data);
      } catch(e) {
        return;
      }

      if (msg.type === "input_audio_buffer.speech_started") {
        setStatus("listening", "LISTENING – I HEAR YOU");
      }

      if (msg.type === "response.created") {
        setStatus("speaking", "GERTY SPEAKING");
        currentGertyLine = addLine("gerty", "");
      }

      if (msg.type === "response.audio_transcript.delta") {
        if (!currentGertyLine) currentGertyLine = addLine("gerty", "");
        currentGertyLine.childNodes[1].nodeValue += msg.delta;
        transcript.scrollTop = transcript.scrollHeight;
      }

      if (msg.type === "response.audio_transcript.done") {
        if (msg.transcript && (!currentGertyLine || currentGertyLine.childNodes[1].nodeValue.trim() === "")) {
          addLine("gerty", msg.transcript);
        }
      }

      if (msg.type === "response.done") {
        currentGertyLine = null;
        setStatus("listening", "LISTENING");
      }

      if (msg.type === "error") {
        setStatus("error", "ERROR");
        addLine("error", JSON.stringify(msg.error));
      }
    };

    stream.getTracks().forEach(track => pc.addTrack(track, stream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await waitForIceGatheringComplete(pc);

    const sdpToSend = pc.localDescription.sdp;

    const sdpRes = await fetch(WORKER_URL + "/session", {
      method: "POST",
      headers: {
        "Content-Type": "application/sdp"
      },
      body: sdpToSend
    });

    const answerText = await sdpRes.text();

    if (!sdpRes.ok) {
      throw new Error(answerText);
    }

    await pc.setRemoteDescription({
      type: "answer",
      sdp: answerText
    });

    busy = false;

  } catch (err) {
    setStatus("error", "ERROR");
    addLine("error", err.message);
    cleanup();
  }
}
</script>

</body>
</html>
