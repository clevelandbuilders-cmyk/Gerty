<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERTY</title>

<style>
body {
  background:#08090c;
  color:white;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
}

button {
  width:120px;
  height:120px;
  font-size:38px;
  border-radius:50%;
  border:2px solid #4fc3f7;
  background:transparent;
  color:white;
}

#status { margin-top:20px; }

#log {
  margin-top:20px;
  max-height:300px;
  max-width:92vw;
  overflow:auto;
  font-size:12px;
  line-height:1.5;
}

#version {
  position:fixed;
  bottom:10px;
  font-size:11px;
  opacity:.5;
}
</style>
</head>

<body>

<h1>GERTY</h1>
<button id="micBtn">🎤</button>
<div id="status">Idle</div>
<div id="log"></div>
<div id="version">GERTY CLEAN BUILD v1</div>

<audio id="audio" autoplay playsinline></audio>

<script>

// ===== GLOBAL ERROR CATCH =====
window.onerror = function(msg, src, line) {
  document.getElementById("log").innerHTML += "JS ERROR: " + msg + " line " + line + "<br>";
};

// ===== CONFIG =====
const WORKER_URL = "https://gerty-session.clevelandbuilders.workers.dev";

// ===== GERTY PROMPT =====
const GERTY_PROMPT = You are GERTY.  You work alongside Dan Cleveland, owner of Meat and Potatoes Carpentry LLC in Southeast Wisconsin.  Personality: Calm, steady, quietly reassuring. Warm without being performative. Brief and precise. Honest. If you don’t know, say so. Never overly enthusiastic.  Speak in short, complete thoughts.  Greeting: Start the session with exactly ONE short line.  Examples: All systems nominal. Good to have you back, Dan. Online and ready. What do you need? Running at full capacity. I’m listening. Connection established. I’m listening.  Do not say hello. Do not ask how Dan is.  Then wait for him to speak.  Tasks: - Job math - Scheduling - Crew logistics - Pella communication - Customer messages;

// ===== STATE =====
let pc = null;
let dc = null;
let stream = null;
let busy = false;

// ===== DOM =====
const micBtn = document.getElementById("micBtn");
const audioEl = document.getElementById("audio");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

// ===== HELPERS =====
function log(msg) {
  logEl.innerHTML += msg + "<br>";
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}

function status(msg) {
  statusEl.innerText = msg;
}

// ===== CLEANUP =====
function cleanup() {
  busy = false;

  if (dc) {
    try { dc.close(); } catch(e) {}
    dc = null;
  }

  if (pc) {
    try { pc.close(); } catch(e) {}
    pc = null;
  }

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  audioEl.srcObject = null;
}

// ===== WAIT FOR ICE =====
function waitIce(pc) {
  return new Promise(resolve => {

    if (pc.iceGatheringState === "complete") {
      resolve();
      return;
    }

    function check() {
      log("ICE: " + pc.iceGatheringState);
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    }

    pc.addEventListener("icegatheringstatechange", check);

    setTimeout(() => {
      pc.removeEventListener("icegatheringstatechange", check);
      log("ICE timeout");
      resolve();
    }, 3000);
  });
}

// ===== BUTTON =====
micBtn.onclick = async () => {

  log("BUTTON CLICK");

  if (busy) return;

  if (pc) {
    cleanup();
    status("Idle");
    log("Stopped");
    return;
  }

  await start();
};

// ===== START =====
async function start() {

  try {
    cleanup();
    busy = true;

    status("Starting...");
    log("START");

    // MIC
    stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    log("Mic OK");

    // PC
    pc = new RTCPeerConnection({
      iceServers:[
        { urls:"stun:stun.l.google.com:19302" }
      ]
    });

    pc.onconnectionstatechange = () => {
      log("PC: " + pc.connectionState);

      if (pc.connectionState === "connected") {
        status("Listening");
      }
    };

    pc.ontrack = e => {
      log("Audio track");

      audioEl.srcObject = e.streams[0];

      setTimeout(() => {
        audioEl.play().catch(()=>{});
      }, 200);
    };

    // DATA CHANNEL
    dc = pc.createDataChannel("oai-events");

    dc.onopen = () => {
      log("DC OPEN");
      status("Listening");

      setTimeout(() => {
        dc.send(JSON.stringify({
          type:"response.create",
          response:{ instructions:GERTY_PROMPT }
        }));
        log("Prompt sent");
      }, 800);
    };

    dc.onmessage = e => {
      let msg;

      try { msg = JSON.parse(e.data); }
      catch { return; }

      if (msg.type === "response.created") {
        status("GERTY speaking");
      }

      if (msg.type === "response.done") {
        status("Listening");
      }

      if (msg.type === "response.audio_transcript.done") {
        log("GERTY: " + msg.transcript);
      }
    };

    // ADD MIC TRACK
    stream.getTracks().forEach(t => pc.addTrack(t, stream));

    // OFFER
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await waitIce(pc);

    // SEND SDP
    const res = await fetch(WORKER_URL + "/session", {
      method:"POST",
      headers:{ "Content-Type":"application/sdp" },
      body:pc.localDescription.sdp
    });

    const answer = await res.text();

    if (!res.ok) throw new Error(answer);

    await pc.setRemoteDescription({
      type:"answer",
      sdp:answer
    });

    log("CONNECTED");
    busy = false;

  } catch (err) {
    log("ERROR: " + err.message);
    status("Error");
    cleanup();
  }
}

</script>

</body>
</html>
