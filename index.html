<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERTY</title>

<style>
body {
  background:#08090c;
  color:#cdd6e8;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

button {
  padding:20px;
  font-size:18px;
  border-radius:50%;
  border:2px solid #4fc3f7;
  background:transparent;
  color:white;
}

#status { margin-top:20px; }
</style>
</head>

<body>

<h1>GERTY</h1>
<button onclick="start()">🎤</button>
<div id="status">Idle</div>

<audio id="audio" autoplay playsinline></audio>

<script>
const WORKER_URL = "https://gerty-session.clevelandbuilders.workers.dev";

let pc, dc, stream;

async function start() {

  document.getElementById("status").innerText = "Connecting...";

  // Mic
  stream = await navigator.mediaDevices.getUserMedia({ audio:true });

  // Get ephemeral key
  const res = await fetch(WORKER_URL + "/session", { method:"POST" });
  const data = await res.json();
  const token = data.value;

  if (!token) {
    document.getElementById("status").innerText = "Worker error";
    return;
  }

  // Peer connection
  pc = new RTCPeerConnection();

  pc.ontrack = e => {
    document.getElementById("audio").srcObject = e.streams[0];
  };

  dc = pc.createDataChannel("oai-events");

  dc.onopen = () => {
    document.getElementById("status").innerText = "Listening";

    dc.send(JSON.stringify({
      type:"session.update",
      session:{
        type:"realtime",
        model:"gpt-realtime",
        output_modalities:["audio","text"]
      }
    }));

    setTimeout(() => {
      dc.send(JSON.stringify({ type:"response.create" }));
    }, 500);
  };

  dc.onmessage = e => {
    const msg = JSON.parse(e.data);

    if (msg.type === "response.audio_transcript.done") {
      console.log("GERTY:", msg.transcript);
    }
  };

  stream.getTracks().forEach(t => pc.addTrack(t, stream));

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const form = new FormData();
  form.append("sdp", new Blob([offer.sdp], { type:"application/sdp" }));

  const call = await fetch("https://api.openai.com/v1/realtime/calls", {
    method:"POST",
    headers:{ Authorization:"Bearer " + token },
    body:form
  });

  const answer = await call.text();

  await pc.setRemoteDescription({
    type:"answer",
    sdp:answer
  });

  document.getElementById("status").innerText = "Connected";
}
</script>

</body>
</html>
