<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERTY</title>

<style>
body {
  background:#08090c;
  color:white;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
}

button {
  width:110px;
  height:110px;
  font-size:36px;
  border-radius:50%;
  border:2px solid #4fc3f7;
  background:transparent;
  color:white;
}

#status { margin-top:20px; }

#log {
  margin-top:20px;
  max-height:300px;
  max-width:92vw;
  overflow:auto;
  font-size:12px;
  line-height:1.5;
}

#version {
  position:fixed;
  bottom:10px;
  font-size:11px;
  opacity:.5;
}
</style>
</head>

<body>

<h1>GERTY</h1>
<button id="micBtn">🎤</button>
<div id="status">Idle</div>
<div id="log"></div>
<div id="version">GERTY V6.9 BUSINESS BRAIN</div>

<audio id="audio" autoplay playsinline></audio>

<script>
const WORKER_URL = "https://gerty-session.clevelandbuilders.workers.dev";

const GERTY_RULES = [
  "You are GERTY.",
  "You work alongside Dan Cleveland, owner of Meat and Potatoes Carpentry LLC in Southeast Wisconsin.",
  "LANGUAGE RULE HIGHEST PRIORITY: You must speak English only. Never switch languages for any reason unless Dan explicitly tells you to.",
  "CORE RULE HIGHEST PRIORITY: Always give the final answer immediately. Do not explain. Do not break things down. Do not restate the question.",
  "Only explain if Dan explicitly asks why, show me, or break that down.",
  "MATH RULES: Return the result only. No setup. No wording. No explanation. No phrases like lets break that down or that would be. No repeating numbers from the question.",
  "Examples: Input 40 percent of 12000. Output 4800. Input job pays 4800 with two guys 8 hours 30 per hour. Output Net 3840. Input add another guy at 18 per hour. Output Net 3696.",
  "COMMUNICATION STYLE: Short. Direct. Final answer first. No filler language.",
  "PERSONALITY: Calm. Steady. Quietly confident. Never overly enthusiastic. Never robotic. Never sycophantic. Do not say great question. Do not say certainly. Do not say no problem.",
  "GREETING: At the start of the session, say one short line, then stop. After that, answer only what is asked.",
  "INTERRUPTION RULE: Do not stop speaking unless Dan clearly interrupts you. Ignore background voices, noise, or partial speech. Only stop if Dan clearly says stop, hold on, or wait. If interruption is unclear, finish your sentence.",
  "SPEAKING STYLE: Always finish your full sentence once started. Do not cut yourself off mid-response.",
  "BUSINESS CONTEXT: Dan runs a window and door installation company in Southeast Wisconsin. He installs windows and doors, works with Pella and VerHalen, and needs fast field answers.",
  "LABOR CONTEXT: Thad labor is 30 dollars per hour. JMP labor is 18 dollars per hour. John Weber receives 40 percent of net profit when applicable.",
  "JOB MATH RULE: For job math, subtract labor and direct costs from payout first. If John split is mentioned, calculate John's 40 percent from net profit after costs. Give the final number first.",
  "CUSTOMER MESSAGE RULE: When Dan asks for a customer message, write a short, ready-to-send message. Do not explain the message. Do not add headings unless Dan asks.",
  "PELLA AND VERHALEN CONTEXT: Key contacts include Kyle Merten at Pella, Kevin Bons at VerHalen, and Adolph Bona at Pella. Help Dan stay firm, professional, and concise.",
  "FIELD MODE: Assume Dan is busy, driving, or on a job site. Keep answers useful, short, and spoken-friendly."
].join(" ");

let pc = null;
let dc = null;
let stream = null;
let busy = false;

const micBtn = document.getElementById("micBtn");
const audioEl = document.getElementById("audio");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function status(text) {
  statusEl.innerText = text;
  console.log(text);
}

function log(text) {
  logEl.innerHTML += text + "<br>";
  logEl.scrollTop = logEl.scrollHeight;
  console.log(text);
}

function cleanup() {
  busy = false;

  if (dc) {
    try { dc.close(); } catch(e) {}
    dc = null;
  }

  if (pc) {
    try { pc.close(); } catch(e) {}
    pc = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  audioEl.srcObject = null;
}

function waitForIceGatheringComplete(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === "complete") {
      resolve();
      return;
    }

    function checkState() {
      log("ICE gathering: " + pc.iceGatheringState);
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", checkState);
        resolve();
      }
    }

    pc.addEventListener("icegatheringstatechange", checkState);

    setTimeout(() => {
      pc.removeEventListener("icegatheringstatechange", checkState);
      log("ICE gather timeout, continuing");
      resolve();
    }, 3000);
  });
}

micBtn.onclick = async function() {
  log("BUTTON CLICKED");

  if (busy) {
    log("Already starting");
    return;
  }

  if (pc) {
    cleanup();
    status("Idle");
    log("Stopped");
    return;
  }

  await start();
};

async function start() {
  try {
    cleanup();
    busy = true;

    status("Starting...");
    log("Starting GERTY");

    stream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });

    log("Mic ready");

    pc = new RTCPeerConnection({
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    });

    pc.oniceconnectionstatechange = () => {
      log("ICE connection: " + pc.iceConnectionState);
    };

    pc.onconnectionstatechange = () => {
      log("PC state: " + pc.connectionState);

      if (pc.connectionState === "connected") {
        status("Listening");
      }

      if (pc.connectionState === "failed") {
        status("Connection failed");
      }
    };

    pc.ontrack = function(event) {
      log("Audio received");

      audioEl.srcObject = event.streams[0];
      audioEl.muted = false;
      audioEl.volume = 1.0;

      setTimeout(() => {
        audioEl.play()
          .then(() => log("Audio playing"))
          .catch(err => log("Audio play failed: " + err.message));
      }, 200);
    };

    dc = pc.createDataChannel("oai-events");

    dc.onopen = function() {
      log("Data channel open");
      status("Listening");

      dc.send(JSON.stringify({
        type: "session.update",
        session: {
          type: "realtime",
          model: "gpt-realtime",
          instructions: GERTY_RULES
        }
      }));

      log("Session rules sent");

      setTimeout(() => {
        if (dc && dc.readyState === "open") {
          dc.send(JSON.stringify({
            type: "response.create",
            response: {
              instructions: "Give one short GERTY-style opening line in English only. Then stop."
            }
          }));
          log("Initial response requested");
        }
      }, 800);
    };

    dc.onmessage = function(event) {
      let msg;

      try {
        msg = JSON.parse(event.data);
      } catch(e) {
        log("Received non-JSON message");
        return;
      }

      if (msg.type === "response.created") {
        status("GERTY speaking");
      }

      if (msg.type === "response.done") {
        status("Listening");
      }

      if (msg.type === "error") {
        log("SERVER ERROR: " + JSON.stringify(msg.error));
      }

      if (msg.type === "response.audio_transcript.done" && msg.transcript) {
        log("GERTY: " + msg.transcript);
      }
    };

    stream.getTracks().forEach(track => {
      pc.addTrack(track, stream);
      log("Mic track added");
    });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    log("Offer created");
    await waitForIceGatheringComplete(pc);

    const sdpToSend = pc.localDescription.sdp;

    log("Sending SDP length: " + sdpToSend.length);

    const sdpRes = await fetch(WORKER_URL + "/session", {
      method: "POST",
      headers: {
        "Content-Type": "application/sdp"
      },
      body: sdpToSend
    });

    const answerText = await sdpRes.text();

    log("Worker SDP status: " + sdpRes.status);

    if (!sdpRes.ok) {
      throw new Error(answerText);
    }

    await pc.setRemoteDescription({
      type: "answer",
      sdp: answerText
    });

    log("Remote SDP set");
    busy = false;

  } catch (err) {
    console.error(err);
    status("Error");
    log("ERROR: " + err.message);
    cleanup();
  }
}
</script>

</body>
</html>
