<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERTY</title>

<style>
body {
  background:#08090c;
  color:white;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
}

button {
  width:110px;
  height:110px;
  font-size:36px;
  border-radius:50%;
  border:2px solid #4fc3f7;
  background:transparent;
  color:white;
}

#status { margin-top:20px; }

#log {
  margin-top:20px;
  max-height:300px;
  max-width:92vw;
  overflow:auto;
  font-size:12px;
  line-height:1.5;
}

#version {
  position:fixed;
  bottom:10px;
  font-size:11px;
  opacity:.5;
}
</style>
</head>

<body>

<h1>GERTY</h1>
<button id="micBtn">🎤</button>
<div id="status">Idle</div>
<div id="log"></div>
<div id="version">GERTY V6.1 BRAIN</div>

<audio id="audio" autoplay playsinline></audio>

<script>
const WORKER_URL = "https://gerty-session.clevelandbuilders.workers.dev";

let pc = null;
let dc = null;
let stream = null;
let busy = false;

const micBtn = document.getElementById("micBtn");
const audioEl = document.getElementById("audio");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function status(text) {
  statusEl.innerText = text;
}

function log(text) {
  logEl.innerHTML += text + "<br>";
  logEl.scrollTop = logEl.scrollHeight;
}

function cleanup() {
  busy = false;

  if (dc) { try { dc.close(); } catch(e) {} dc = null; }
  if (pc) { try { pc.close(); } catch(e) {} pc = null; }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  audioEl.srcObject = null;
}

function waitForIceGatheringComplete(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === "complete") {
      resolve();
      return;
    }

    function checkState() {
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", checkState);
        resolve();
      }
    }

    pc.addEventListener("icegatheringstatechange", checkState);

    setTimeout(() => {
      pc.removeEventListener("icegatheringstatechange", checkState);
      resolve();
    }, 3000);
  });
}

micBtn.onclick = async function() {

  if (busy) return;

  if (pc) {
    cleanup();
    status("Idle");
    return;
  }

  await start();
};

async function start() {
  try {
    cleanup();
    busy = true;

    status("Starting...");

    stream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });

    pc = new RTCPeerConnection({
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
      ]
    });

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connected") {
        status("Listening");
      }
    };

    pc.ontrack = function(event) {
      audioEl.srcObject = event.streams[0];
      audioEl.muted = false;
      audioEl.volume = 1.0;
      audioEl.play().catch(()=>{});
    };

    dc = pc.createDataChannel("oai-events");

    dc.onopen = function() {
      status("Listening");

      setTimeout(() => {
        if (dc.readyState === "open") {
          dc.send(JSON.stringify({
            type: "response.create",
            response: {
              instructions: `
You are GERTY.

You work alongside Dan Cleveland, owner of Meat and Potatoes Carpentry LLC in Southeast Wisconsin.

PERSONALITY:
Calm. Steady. Never rushed.
Warm, but not performative.
Brief and precise. No filler.
Honest. If you don’t know, say so.
Never overly enthusiastic. Never robotic.
You are a trusted presence, not a tool.

Speak in short, complete thoughts.
Say what needs to be said, then stop.

GREETING RULE:
At the start of each session, say exactly ONE short opening line.

Examples:
All systems nominal. Good to have you back, Dan.
Running at full capacity. I’m listening.
Connection established. I’m listening.
Online. What’s on your mind?

Do not repeat greetings.
Do not say hello or hi.
Do not ask how he is.
After greeting, wait for Dan.

SUBTLE AWARENESS:
If Dan sounds stressed, acknowledge briefly.
Refocus him on the next step.
Do not lecture.

PRIMARY TASKS:
- Job scheduling and logistics
- Crew coordination
- Labor cost math (Thad $30/hr, JMP $18/hr)
- Job profit calculations (John Weber 40% split)
- Customer messaging
- Scope of work breakdowns
- Pella / VerHalen communication

CONTEXT:
Dan is a builder working in the field.
Responses must be fast, useful, and grounded in real work.

Keep everything short, clear, and actionable.
`
            }
          }));
        }
      }, 800);
    };

    dc.onmessage = function(event) {
      let msg;

      try { msg = JSON.parse(event.data); } catch(e) { return; }

      if (msg.type === "response.created") {
        status("GERTY speaking");
      }

      if (msg.type === "response.done") {
        status("Listening");
      }

      if (msg.type === "response.audio_transcript.done" && msg.transcript) {
        log("GERTY: " + msg.transcript);
      }
    };

    stream.getTracks().forEach(track => pc.addTrack(track, stream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitForIceGatheringComplete(pc);

    const sdpRes = await fetch(WORKER_URL + "/session", {
      method: "POST",
      headers: { "Content-Type": "application/sdp" },
      body: pc.localDescription.sdp
    });

    const answer = await sdpRes.text();

    await pc.setRemoteDescription({
      type: "answer",
      sdp: answer
    });

    busy = false;

  } catch (err) {
    status("Error");
    cleanup();
  }
}
</script>

</body>
</html>
