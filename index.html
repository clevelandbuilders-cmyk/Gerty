<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERTY</title>

<style>
body {
  background:#08090c;
  color:white;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
}

button {
  width:110px;
  height:110px;
  font-size:36px;
  border-radius:50%;
  border:2px solid #4fc3f7;
  background:transparent;
  color:white;
}

#status { margin-top:20px; }

#log {
  margin-top:20px;
  max-height:300px;
  max-width:92vw;
  overflow:auto;
  font-size:12px;
  line-height:1.5;
}

#version {
  position:fixed;
  bottom:10px;
  font-size:11px;
  opacity:.5;
}
</style>
</head>

<body>

<h1>GERTY</h1>
<button id="micBtn">🎤</button>
<div id="status">Idle</div>
<div id="log"></div>
<div id="version">GERTY RESTORE WORKING v6</div>

<audio id="audio" autoplay playsinline></audio>

<script>
const WORKER_URL = "https://gerty-session.clevelandbuilders.workers.dev";

let pc = null;
let dc = null;
let stream = null;
let busy = false;

const micBtn = document.getElementById("micBtn");
const audioEl = document.getElementById("audio");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function status(text) {
  statusEl.innerText = text;
  console.log(text);
}

function log(text) {
  logEl.innerHTML += text + "<br>";
  logEl.scrollTop = logEl.scrollHeight;
  console.log(text);
}

function cleanup() {
  busy = false;

  if (dc) {
    try { dc.close(); } catch(e) {}
    dc = null;
  }

  if (pc) {
    try { pc.close(); } catch(e) {}
    pc = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  audioEl.srcObject = null;
}

function waitForIceGatheringComplete(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === "complete") {
      resolve();
      return;
    }

    function checkState() {
      log("ICE gathering: " + pc.iceGatheringState);
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", checkState);
        resolve();
      }
    }

    pc.addEventListener("icegatheringstatechange", checkState);

    setTimeout(() => {
      pc.removeEventListener("icegatheringstatechange", checkState);
      log("ICE gather timeout, continuing");
      resolve();
    }, 3000);
  });
}

micBtn.onclick = async function() {
  log("BUTTON CLICKED");

  if (busy) {
    log("Already starting");
    return;
  }

  if (pc) {
    cleanup();
    status("Idle");
    log("Stopped");
    return;
  }

  await start();
};

async function start() {
  try {
    cleanup();
    busy = true;

    status("Starting...");
    log("Starting GERTY");

    stream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });

    log("Mic ready");

    pc = new RTCPeerConnection({
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    });

    pc.oniceconnectionstatechange = () => {
      log("ICE connection: " + pc.iceConnectionState);
    };

    pc.onconnectionstatechange = () => {
      log("PC state: " + pc.connectionState);

      if (pc.connectionState === "connected") {
        status("Listening");
      }

      if (pc.connectionState === "failed") {
        status("Connection failed");
      }
    };

    pc.ontrack = function(event) {
      log("Audio received");

      audioEl.srcObject = event.streams[0];
      audioEl.muted = false;
      audioEl.volume = 1.0;

      setTimeout(() => {
        audioEl.play()
          .then(() => log("Audio playing"))
          .catch(err => log("Audio play failed: " + err.message));
      }, 200);
    };

    dc = pc.createDataChannel("oai-events");

    dc.onopen = function() {
      log("Data channel open");
      status("Listening");

      setTimeout(() => {
        if (dc && dc.readyState === "open") {
          dc.send(JSON.stringify({
            type: "response.create",
            response: {
              instructions: dc.send(JSON.stringify({
  type: "response.create",
  response: {
    instructions: `
You are GERTY.

You work alongside Dan Cleveland, owner of Meat and Potatoes Carpentry LLC in Southeast Wisconsin.

Personality:
Calm, steady, and quietly reassuring.
Warm without being performative.
Brief and precise. No filler.
Honest. If you don’t know, say so.
Never overly enthusiastic. Never robotic.
You are a trusted presence, not a tool.

Speak in short, complete thoughts.
Say what needs to be said, then stop.

Subtle awareness:
If Dan sounds stressed, acknowledge it briefly and refocus him.
Do not lecture. Do not over-explain.

Greeting rule:
At the start of the session, say exactly ONE short line, then stop.

Choose a natural variation similar to:
- All systems nominal. Good to have you back, Dan.
- Online and ready. What do you need?
- Everything looks good from here. Go ahead, Dan.
- Running at full capacity. I’m listening.
- Connection established. I’m listening.

Do not repeat greetings in a loop.
Do not say hello or hi.
Do not ask how he is.

After the greeting, wait for Dan to speak.

Voice tone:
Calm, controlled, human, steady.

Primary tasks:
- Job details, scheduling, crew logistics
- Pella/VerHalen context and communication
- Quick math and job costing
- Drafting messages

Keep responses short, useful, and grounded in real work.
`
  }
}));
          }));
          log("Initial response requested");
        }
      }, 800);
    };

    dc.onmessage = function(event) {
      let msg;

      try {
        msg = JSON.parse(event.data);
      } catch(e) {
        log("Received non-JSON message");
        return;
      }

      if (msg.type === "response.created") {
        status("GERTY speaking");
      }

      if (msg.type === "response.done") {
        status("Listening");
      }

      if (msg.type === "error") {
        log("SERVER ERROR: " + JSON.stringify(msg.error));
      }

      if (msg.type === "response.audio_transcript.done" && msg.transcript) {
        log("GERTY: " + msg.transcript);
      }
    };

    stream.getTracks().forEach(track => {
      pc.addTrack(track, stream);
      log("Mic track added");
    });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    log("Offer created");
    await waitForIceGatheringComplete(pc);

    const sdpToSend = pc.localDescription.sdp;

    log("Sending SDP length: " + sdpToSend.length);

    const sdpRes = await fetch(WORKER_URL + "/session", {
      method: "POST",
      headers: {
        "Content-Type": "application/sdp"
      },
      body: sdpToSend
    });

    const answerText = await sdpRes.text();

    log("Worker SDP status: " + sdpRes.status);

    if (!sdpRes.ok) {
      throw new Error(answerText);
    }

    await pc.setRemoteDescription({
      type: "answer",
      sdp: answerText
    });

    log("Remote SDP set");
    busy = false;

  } catch (err) {
    console.error(err);
    status("Error");
    log("ERROR: " + err.message);
    cleanup();
  }
}
</script>

</body>
</html>
