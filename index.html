<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERTY</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08090c;
    --panel: #0d0f14;
    --border: #1c2030;
    --accent: #4fc3f7;
    --accent2: #00e5ff;
    --warn: #ef5350;
    --ok: #66bb6a;
    --text: #cdd6e8;
    --muted: #4a5568;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Rajdhani', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 99;
  }

  .container {
    width: min(480px, 95vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    position: relative;
    z-index: 1;
  }

  .header { text-align: center; letter-spacing: 0.25em; }

  .header h1 {
    font-family: var(--mono);
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 400;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(79,195,247,0.4);
    letter-spacing: 0.5em;
  }

  .header p {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .ring-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .ring-track { fill: none; stroke: var(--border); stroke-width: 2; }

  .ring-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 565;
    stroke-dashoffset: 565;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
    filter: drop-shadow(0 0 6px rgba(79,195,247,0.6));
  }

  .ring-fill.speaking {
    stroke: var(--accent2);
    filter: drop-shadow(0 0 10px rgba(0,229,255,0.7));
  }

  .pulse {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--accent);
    opacity: 0;
    pointer-events: none;
  }

  .pulse.active { animation: pulse-out 2s ease-out infinite; }
  .pulse:nth-child(2) { animation-delay: 0.5s; }
  .pulse:nth-child(3) { animation-delay: 1s; }

  @keyframes pulse-out {
    0%   { width: 160px; height: 160px; opacity: 0.4; }
    100% { width: 240px; height: 240px; opacity: 0; }
  }

  .btn-wrap { position: relative; z-index: 1; }

  button#micBtn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: rgba(79,195,247,0.06);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    position: relative;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  button#micBtn:hover { background: rgba(79,195,247,0.12); box-shadow: 0 0 24px rgba(79,195,247,0.3); }
  button#micBtn.active { background: rgba(79,195,247,0.15); border-color: var(--accent2); box-shadow: 0 0 32px rgba(0,229,255,0.4); }
  button#micBtn.error { border-color: var(--warn); background: rgba(239,83,80,0.1); }

  .mic-icon { width: 40px; height: 40px; fill: var(--accent); transition: fill 0.25s; }
  button#micBtn.active .mic-icon { fill: var(--accent2); }
  button#micBtn.error .mic-icon { fill: var(--warn); }

  .status-bar {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 20px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }

  .status-dot.idle { background: var(--muted); }
  .status-dot.listening { background: var(--ok); animation: blink 1s ease-in-out infinite; }
  .status-dot.speaking { background: var(--accent2); animation: blink 0.6s ease-in-out infinite; }
  .status-dot.error { background: var(--warn); }
  .status-dot.connecting { background: var(--accent); animation: blink 0.4s linear infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .transcript {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    min-height: 90px;
    max-height: 160px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 0.72rem;
    line-height: 1.6;
    color: #8899aa;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .transcript .line { margin-bottom: 4px; }
  .transcript .line.gerty { color: var(--accent); }
  .transcript .line.user { color: #aabbcc; }
  .transcript .line .label { color: var(--muted); margin-right: 6px; }

  .corner { position: absolute; width: 12px; height: 12px; border-color: var(--accent); border-style: solid; opacity: 0.4; }
  .corner.tl { top: 0; left: 0; border-width: 1px 0 0 1px; }
  .corner.tr { top: 0; right: 0; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

  .transcript-wrap { width: 100%; position: relative; padding: 4px; }
  .info-row { font-family: var(--mono); font-size: 0.6rem; color: var(--muted); letter-spacing: 0.15em; opacity: 0.5; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>GERTY</h1>
    <p>Meat &amp; Potatoes Carpentry &mdash; Voice Assistant</p>
  </div>

  <div class="ring-wrap">
    <div class="pulse"></div>
    <div class="pulse"></div>
    <div class="pulse"></div>
    <svg class="ring-svg" viewBox="0 0 200 200">
      <circle class="ring-track" cx="100" cy="100" r="90"/>
      <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="90"/>
    </svg>
    <div class="btn-wrap">
      <button id="micBtn" aria-label="Start voice session">
        <svg class="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot idle" id="statusDot"></div>
    <span id="statusText">IDLE &mdash; PRESS TO CONNECT</span>
  </div>

  <div class="transcript-wrap">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="transcript" id="transcript">
      <div class="line gerty"><span class="label">GERTY &rsaquo;</span>Hello, Dan. Ready when you are.</div>
    </div>
  </div>

  <div class="info-row">OPENAI REALTIME &mdash; WEBRTC &mdash; v1.0</div>
</div>

<audio id="audioOut" autoplay playsinline></audio>

<script>
(function() {
  "use strict";

  var WORKER_URL = "https://gerty-session.clevelandbuilders.workers.dev";

  var state = "idle";
  var pc = null;
  var dc = null;
  var micStream = null;

  var micBtn    = document.getElementById("micBtn");
  var statusDot = document.getElementById("statusDot");
  var statusText = document.getElementById("statusText");
  var transcript = document.getElementById("transcript");
  var audioOut  = document.getElementById("audioOut");
  var ringFill  = document.getElementById("ringFill");
  var pulses    = document.querySelectorAll(".pulse");

  function setState(s, label) {
    state = s;
    statusDot.className = "status-dot " + s;
    statusText.textContent = label || s.toUpperCase();
    var isActive = (s === "listening" || s === "speaking" || s === "connecting");
    micBtn.className = isActive ? "active" : (s === "error" ? "error" : "");
    pulses.forEach(function(p) { p.className = isActive ? "pulse active" : "pulse"; });
    if (s === "speaking") { ringFill.classList.add("speaking"); } else { ringFill.classList.remove("speaking"); }
  }

  function setRing(pct) {
    var circumference = 565;
    ringFill.style.strokeDashoffset = circumference - (circumference * pct);
  }

  function addLine(who, text) {
    var div = document.createElement("div");
    div.className = "line " + who;
    var label = document.createElement("span");
    label.className = "label";
    label.textContent = (who === "gerty") ? "GERTY >" : "YOU >";
    div.appendChild(label);
    div.appendChild(document.createTextNode(text));
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
  }

  var analyser = null;
  var levelBuf = null;
  var levelLoop = null;

  function startLevelMonitor(stream) {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var src = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
      levelBuf = new Uint8Array(analyser.frequencyBinCount);
      levelLoop = requestAnimationFrame(updateLevel);
    } catch(e) {}
  }

  function updateLevel() {
    if (!analyser) return;
    analyser.getByteFrequencyData(levelBuf);
    var sum = 0;
    for (var i = 0; i < levelBuf.length; i++) sum += levelBuf[i];
    setRing(Math.min((sum / levelBuf.length) / 80, 1));
    levelLoop = requestAnimationFrame(updateLevel);
  }

  function stopLevelMonitor() {
    if (levelLoop) { cancelAnimationFrame(levelLoop); levelLoop = null; }
    analyser = null;
    setRing(0);
  }

  async function connect() {
    setState("connecting", "CONNECTING...");

    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch(e) {
      setState("error", "MIC DENIED");
      addLine("gerty", "I need microphone access, Dan. Please allow it and try again.");
      return;
    }

    try {
      var res = await fetch(WORKER_URL + "/session", { method: "POST" });
      if (!res.ok) throw new Error("Worker returned " + res.status);
      var data = await res.json();
      var ephToken = data.client_secret && data.client_secret.value;
      if (!ephToken) throw new Error("No ephemeral token in response");

      pc = new RTCPeerConnection();
      micStream.getTracks().forEach(function(track) { pc.addTrack(track, micStream); });

      pc.ontrack = function(evt) {
        audioOut.srcObject = evt.streams[0];
        setState("speaking", "GERTY SPEAKING");
      };

      dc = pc.createDataChannel("oai-events");
      dc.onopen = function() { setState("listening", "LISTENING"); startLevelMonitor(micStream); sendSessionUpdate(); };
      dc.onmessage = function(evt) { handleServerEvent(evt.data); };
      dc.onclose = function() { setState("idle", "IDLE -- PRESS TO CONNECT"); };

      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      var sdpRes = await fetch(
        "https://api.openai.com/v1/realtime?model=gpt-4o-realtime-preview-2024-12-17",
        {
          method: "POST",
          headers: { "Authorization": "Bearer " + ephToken, "Content-Type": "application/sdp" },
          body: offer.sdp
        }
      );
      if (!sdpRes.ok) throw new Error("SDP exchange failed: " + sdpRes.status);
      var answerSdp = await sdpRes.text();
      await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });

    } catch(e) {
      console.error("Connect error:", e);
      setState("error", "ERROR -- TAP TO RETRY");
      addLine("gerty", "Something went wrong. " + e.message);
      cleanup();
    }
  }

  function sendSessionUpdate() {
    if (!dc || dc.readyState !== "open") return;
    dc.send(JSON.stringify({
      type: "session.update",
      session: {
        modalities: ["text", "audio"],
        voice: "alloy",
        instructions: "You are GERTY, a calm, warm, and quietly reassuring AI assistant. You work with Dan Cleveland, owner of Meat and Potatoes Carpentry LLC, a window and door installation company in Southeast Wisconsin. Keep all responses short and grounded. Never be overly cheerful. Speak like the AI from the film Moon: gentle, precise, and trustworthy. Help Dan with job scheduling, Pella payment questions, crew logistics, customer communications, and anything else he needs in the field. If you do not know something, say so plainly.",
        turn_detection: { type: "server_vad", threshold: 0.5, prefix_padding_ms: 300, silence_duration_ms: 600 },
        input_audio_transcription: { model: "whisper-1" }
      }
    }));
  }

  function handleServerEvent(raw) {
    var evt;
    try { evt = JSON.parse(raw); } catch(e) { return; }
    switch (evt.type) {
      case "conversation.item.input_audio_transcription.completed":
        if (evt.transcript) addLine("user", evt.transcript);
        break;
      case "response.audio_transcript.done":
        if (evt.transcript) addLine("gerty", evt.transcript);
        break;
      case "response.audio.delta":
        setState("speaking", "GERTY SPEAKING");
        setRing(0.7);
        break;
      case "response.audio.done":
      case "response.done":
        if (state === "speaking") { setState("listening", "LISTENING"); startLevelMonitor(micStream); }
        break;
      case "input_audio_buffer.speech_started":
        setState("listening", "LISTENING -- I HEAR YOU");
        break;
      case "error":
        addLine("gerty", "I encountered an error. " + ((evt.error && evt.error.message) || ""));
        break;
    }
  }

  function cleanup() {
    stopLevelMonitor();
    if (micStream) { micStream.getTracks().forEach(function(t) { t.stop(); }); micStream = null; }
    if (dc) { try { dc.close(); } catch(e) {} dc = null; }
    if (pc) { try { pc.close(); } catch(e) {} pc = null; }
    audioOut.srcObject = null;
  }

  function disconnect() { cleanup(); setState("idle", "IDLE -- PRESS TO CONNECT"); }

  micBtn.addEventListener("click", function() {
    if (state === "idle" || state === "error") { connect(); }
    else { disconnect(); addLine("gerty", "Session ended. Goodbye, Dan."); }
  });

  setState("idle", "IDLE -- PRESS TO CONNECT");
  setRing(0);

})();
</script>
</body>
</html>
